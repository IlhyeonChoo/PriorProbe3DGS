library:
  name: shapesplat
  source: shapesplat
  manifest_path: outputs/prior_library/shapesplat_manifest.json
  default_objects:
    - object_id: chair_basic
      category: chair
      gaussian_path: data/priors/shapesplat/chair_basic.ply
      feature_path: data/priors/shapesplat/chair_basic.npy
      placeholder: true
      scale_meters: [0.60, 0.90, 0.60]
      tags: [baseline, indoor]
    - object_id: lamp_domain
      category: lamp
      gaussian_path: data/priors/shapesplat/lamp_domain.ply
      feature_path: data/priors/shapesplat/lamp_domain.npy
      placeholder: true
      scale_meters: [0.20, 0.45, 0.20]
      tags: [domain, indoor]
