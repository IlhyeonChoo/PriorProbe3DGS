experiment:
  name: oracle_prior_vanilla_3dgs_clip
  initialization: prior
  reconstruction_backend: vanilla_3dgs
  dataset_config: configs/datasets/replica_shared.yaml
  prior_config: configs/priors/generated/shapesplat_modelnet_chair_clip_shared.yaml
  retrieval_mode: oracle_category
  alignment_mode: oracle_manual
  adaptation: none
  prior_object_id: null
  feature_backend: clip

oracle:
  categories: [chair]
  max_objects: 1

backend:
  repo_path: ../3DGS/gaussian-splatting
  python_executable: ../3DGS/gaussian-splatting/venv/bin/python
  source_path: /path/to/colmap_scene
  model_path: CHANGE_ME_DATASET_OUTPUT
  disable_viewer: true
  quiet: true
  dry_run: false
  init_mode: merge

prior_alignment: {}

trainer:
  iterations: 7000
  sh_degree: 3
  test_iterations: [500, 1000, 2000, 3000, 5000, 7000]
  save_iterations: [500, 1000, 2000, 3000, 5000, 7000]
  checkpoint_iterations: []
