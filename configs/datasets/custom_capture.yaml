dataset:
  name: custom_capture
  phase: B
  root: data/custom_capture
  format: colmap
  default_scene_id: capture_001
  source_path_template: "{root}/{scene_id}"
  images: images
  depths: ""
  eval: false
  white_background: false
  scene_type: domain_matched_indoor
  object_count_range: [1, 3]
  occlusion_buckets:
    - low
    - high
  scenes:
    capture_001:
      relative_path: capture_001
