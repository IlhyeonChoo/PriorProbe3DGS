dataset:
  name: replica
  phase: A
  root: /mnt/3dgs-ssd/3dgs-stage/priorprobe3dgs/replica_colmap
  format: colmap
  default_scene_id: room_0
  source_path_template: "{root}/{scene_id}"
  images: images
  depths: ""
  eval: true
  white_background: false
  scene_type: controlled_indoor
  object_count_range: [1, 3]
  occlusion_buckets:
    - low
    - high
  notes:
    - Replica oracle exports are staged on SSD for actual training runs.
    - Large raw datasets stay on HDD under /mnt/hddg1/3dgs-data/priorprobe3dgs.
  scenes:
    room_0:
      relative_path: room_0
    office_0:
      relative_path: office_0
