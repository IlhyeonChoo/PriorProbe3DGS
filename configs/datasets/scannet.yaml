dataset:
  name: scannet
  phase: A
  root: data/public_datasets/scannet_colmap
  format: colmap
  default_scene_id: scene0000_00
  source_path_template: "{root}/{scene_id}"
  images: images
  depths: ""
  eval: false
  white_background: false
  scene_type: controlled_indoor
  object_count_range: [1, 3]
  occlusion_buckets:
    - low
    - high
  notes:
    - ScanNet 원본을 직접 읽는 것이 아니라, object/scene subset을 COLMAP-compatible 레이아웃으로 export한 결과를 가정한다.
    - ShapeSplat training dataset과는 분리된 evaluation target으로 사용한다.
  scenes:
    scene0000_00:
      relative_path: scene0000_00
    scene0005_00:
      relative_path: scene0005_00
